name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    name: Tests and Expo lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply compatible dependency security fixes
        run: npm audit fix || true
      - name: Commit compatible lockfile updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply compatible dependency security fixes"
            git push origin HEAD:main
          fi
      - name: Report dependency advisories
        shell: bash
        run: |
          npm audit --json > /tmp/bloco-npm-audit.json || true
          node -e "const report = require('/tmp/bloco-npm-audit.json'); console.log('Dependency advisories:', JSON.stringify(report.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log([item.severity, name, 'direct=' + item.isDirect, 'fix=' + JSON.stringify(item.fixAvailable), 'via=' + item.via.map(entry => typeof entry === 'string' ? entry : entry.name).join(',')].join(' | '));"
      - name: Run storage tests
        run: npm test
      - name: Check Expo dependency versions
        run: npx expo install --check
      - name: Run Expo lint
        run: npx expo lint
      - name: Build Android JavaScript bundle
        run: npx expo export --platform android
